[build]
  cmd = "go build -o ./tmp/identity ./cmd/identity"
  entrypoint = "./tmp/identity"
  delay = 1000
  exclude_dir = ["tmp", "vendor", "ent", "cmd/identity/admin"]
  include_ext = ["go", "env"]
  kill_delay = "2s"
  rerun_delay = 500

[log]
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true

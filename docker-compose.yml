# Standalone compose for the Identity plugin.
#
# Connects to the SHARED Postgres run from the apicorex (Core) repo's
# docker-compose.yml, exposed on the host at 15432. Start that stack first:
#
#   cd ../apicorex && docker compose up -d postgres
#   docker compose up --build
#
# The plugin also needs a running ApiCoreX Core to register with — point
# CORE_URL at it (also run from the apicorex repo's docker-compose.yml).
#
services:
  identity:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://apicorex:apicorex@host.docker.internal:15432/apicorex?sslmode=disable
      PLUGIN_API_KEY: change-me-plugin-key
      PLATFORM_ADMIN_EMAILS: owner@acme.com
      # Core's URL. When Core also runs in Docker, attach both to the same
      # network and use the Core service name, e.g. http://core:9999.
      CORE_URL: http://host.docker.internal:9999
      PLUGIN_ADDR: ":50051"
      # URL Core uses to reach this plugin. Must be resolvable from Core. Core
      # and this plugin run as separate compose projects (separate networks),
      # so a container-name URL (http://identity:50051) doesn't resolve from
      # Core's side — go through the host instead, same as CORE_URL above.
      PLUGIN_BASE_URL: http://host.docker.internal:50051
    ports:
      - "50051:50051"
    extra_hosts:
      - "host.docker.internal:host-gateway"
